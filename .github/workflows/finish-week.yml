name: BotBlitz End of Week Workflow

on:
  workflow_dispatch:
  schedule:
    # Tuesday 5:12 PM UTC -- well after update-scores.yml's final weekly fire
    # (Tuesday 05:20 UTC, after Monday Night Football), so the week's stats
    # are fully in before scoring is finalized.
    - cron: "12 17 * * 2"

jobs:
  buildAndTest:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-go@v5.0.0
      with:
        # The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks.
        go-version: '1.21.7'
    
    - name: Check starting Go version
      run: go version

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get install -y protobuf-compiler

    - name: Install golang proto tools
      run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

    - name: Install GRPC proto tools
      run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Install python grpc tools
      run: pip install -r requirements.txt

    - name: Check protoc version
      run: protoc --version

    - name: Docker version
      run: docker -v

    - name: Clean generated proto
      run: make clean

    - name: Generate proto
      run: make gen

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.x'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Finish previous fantasy week
      # -year=2026: the engine defaults to 2025 (flag.Int's zero value), and
      # run-finish-week never overrode it. There's also no stats-fetch step
      # here anymore (dead leftover from the pre-2026 per-year stats.db
      # architecture, and it was scraping into data/stats/2025/stats.db --
      # the wrong year *and* a file this game mode never reads) -- season.db's
      # weekly_stats is already kept current by update-scores.yml, which
      # this job just needs to read, not re-fetch.
      run: go run pkg/cmd/engine_bootstrap.go -game_mode=FinishPreviousWeek -year=2026

    - name: Create PR w/ new gamestate
      id: cpr
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ github.token }}
        title: '[Automated] Finish previous fantasy week'
        commit-message: '[Automated] Finish previous fantasy week'
        add-paths: |
            data/game_states/2026/season.db
        branch: finish-weekly-fantasy
        auto-merge-method: squash
    
    - name: Enable auto-merge
      if: steps.cpr.outputs.pull-request-number != ''
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
        merge-method: squash
